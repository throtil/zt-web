# Направление запросов на index.php — то, что обычно делает .htaccess.
#
# Постоянные адреса статей вида /название-статьи/ — это не файлы на диске.
# Кто-то должен направить такой запрос в index.php, иначе Apache отвечает 404,
# и сайт выглядит так: ссылки красивые, ни одна не открывается.
#
# Обычно это делает .htaccess, который WordPress пишет сам. В официальном
# образе он бесполезен: в apache2.conf для /var/www/ стоит `AllowOverride None`,
# то есть файл лежит на месте, выглядит правильным и не читается вовсе.
# Проверено на образе wordpress:7.0.2-php8.3-apache.
#
# Правила заданы здесь, а не включением AllowOverride, по двум причинам:
# .htaccess живёт в томе ядра и не версионируется, а его перезапись зависит от
# того, дошли ли до сохранения настроек в админке. Директивы в конфигурации
# приезжают из репозитория вместе с остальным.
#
# Содержимое повторяет то, что WordPress пишет в .htaccess. Контекст
# <Directory> для mod_rewrite равнозначен контексту .htaccess: префикс каталога
# отсекается, поэтому нужен RewriteBase, а подстановка задаётся от корня сайта.

<Directory /var/www/html>
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteBase /

		# Заголовок Authorization до PHP через mod_php не доходит. Без этой
		# строки не работают пароли приложений в REST API.
		RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

		RewriteRule ^index\.php$ - [L]
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . /index.php [L]
	</IfModule>
</Directory>
