# Ограничение числа рабочих процессов Apache.
#
# УСТУПКА ТЕСТОВОЙ МАШИНЕ, но частично настоящее решение.
# Официальный образ использует mpm_prefork с mod_php: каждый рабочий процесс
# держит свой интерпретатор, а его memory_limit равен ZT_PHP_MEMORY_LIMIT.
# Значения по умолчанию (MaxRequestWorkers 150) на машине с 981 МБ означают,
# что при десятке одновременных запросов процессы будут остановлены системой.
#
# Сайт с одним автором и без кэша обслуживает единицы одновременных запросов.
# Восьми процессов достаточно, и это ограничивает пик по памяти сверху.
# На целевой машине значение пересматривается вместе с решением
# mod_php против php-fpm — см. docs/test-machine-concessions.md.

<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 2
	MaxSpareServers 4
	MaxRequestWorkers 8
	# Процесс перезапускается после сотен запросов: утечки в PHP-расширениях
	# не накапливаются в долгоживущем процессе.
	MaxConnectionsPerChild 500
</IfModule>

# Тело запроса ограничивает Caddy и PHP; Apache здесь не должен добавлять
# собственный, более низкий предел.
LimitRequestBody 0

# Версию сервера в заголовках не раскрываем.
ServerTokens Prod
ServerSignature Off
