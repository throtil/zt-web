schema: spec-driven

context: |
  Личный некоммерческий сайт с обзорами и тестами заточных камней, станков
  и расходников.

  Роли разделены и принадлежат разным людям:
    - редактор — пишет статьи, загружает фото, работает только через веб-админку,
      доступа к серверу и репозиторию не имеет;
    - разработчик — владеет репозиторием, сервером и деплоем.
  Спеки и процедуры должны учитывать это разделение: у редактора не должно быть
  прав, ломающих воспроизводимость сервера, а у разработчика не должно быть
  необходимости вмешиваться в обычное заполнение статей.

  Движок: WordPress (self-hosted), развёртывание через Docker Compose на VPS.
  Приоритет — удобство заполнения статей: шаблоны разметки (Block Patterns),
  массовая загрузка фото, автоматические превью.

  Ключевое архитектурное решение: медиа НЕ живёт на диске сервера.
  Фото (100 ГБ+, оригиналы 2-50 МБ) уезжают в объектное хранилище
  (Backblaze B2 или Cloudflare R2) и раздаются через Cloudflare CDN.
  Видео хранится отдельно от фото (YouTube-embed + своя копия файла,
  либо Bunny Stream).

  Что версионируется в этом репозитории:
    - инфраструктура: docker-compose, конфиги nginx/TLS, провижининг VPS
    - child-тема, кастомные Gutenberg-блоки и паттерны
    - mu-plugin со своими доработками
    - декларативный список плагинов WP (не клики в админке)
    - скрипты бэкапа БД и деплоя
    - openspec/ со спеками

  Что НЕ версионируется: ядро WordPress, wp-content/uploads, секреты
  (wp-config credentials, ключи хранилища, токены).

  Порядок работы: сначала базовая инфраструктура и деплой, затем медиа-пайплайн,
  затем структура контента (таксономии) и шаблон обзора.

rules:
  proposal:
    - Явно указывать, что попадает в git, а что остаётся на сервере или в хранилище
    - Указывать, как секреты передаются в контейнеры (никогда не в git)
  tasks:
    - Задачи по инфраструктуре должны быть воспроизводимы с нуля на чистом VPS
